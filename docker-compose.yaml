services:
  postgres:
    image: postgres:17
    container_name: flights_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  collector:
    build: .
    container_name: flights_collector
    env_file: .env
    environment:
      DATABASE_URL: postgresql://flights:${POSTGRES_PASSWORD}@postgres:5432/flights
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata: